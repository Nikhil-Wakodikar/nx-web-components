<div style="padding: 1rem">
  <nx-icon name="users"></nx-icon>
  <nx-icon>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="800px"
      height="800px"
      viewBox="0 0 24 24"
      fill="none"
    >
      <path
        d="M7 12H17M8 8.5C8 8.5 9 9 10 9C11.5 9 12.5 8 14 8C15 8 16 8.5 16 8.5M8 15.5C8 15.5 9 16 10 16C11.5 16 12.5 15 14 15C15 15 16 15.5 16 15.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
        stroke="#000000"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </nx-icon>

  <nx-icon>
    <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="" />
  </nx-icon>

  <!-- <nx-button>Default</nx-button>

  <nx-button fill="outline"> Outline </nx-button>

  <nx-button fill="clear"> Clear </nx-button>

  <nx-button shape="round"> Round </nx-button>

  <nx-button expand="full"> Full </nx-button>

  <nx-button expand="block"> Block </nx-button>

  <nx-button size="small">Small</nx-button>

  <nx-button>Default</nx-button>

  <nx-button size="large">Large</nx-button> -->

  <nx-select value="premium">
    <nx-select-option value="standard">Standard</nx-select-option>
    <nx-select-option value="premium">Premium</nx-select-option>
    <nx-select-option value="flexible" disabled>Flexible</nx-select-option>
  </nx-select>

  <div style="margin: 20px">
    <nx-checkbox>
      I agree to the Terms,Conditions,and Notices(TCN).
    </nx-checkbox>
  </div>

  <nx-radio-group value="male">
    <nx-radio value="male">Male</nx-radio>

    <nx-radio value="female">Female</nx-radio>

    <nx-radio value="other">Other</nx-radio>
  </nx-radio-group>

  <nx-grid>
    <nx-row>
      <nx-col size-xs="12" size-sm="6" size-md="3"> 1 </nx-col>

      <nx-col size-xs="12" size-sm="6" size-md="3"> 2 </nx-col>

      <nx-col size-xs="12" size-sm="6" size-md="3"> 3 </nx-col>

      <nx-col size-xs="12" size-sm="6" size-md="3"> 4 </nx-col>
    </nx-row>
  </nx-grid>

  <!-- <div>
    <nx-checkbox class="my-checkbox"> AcceptTerms&Conditions </nx-checkbox>
  </div>

  <nx-button class="btn">Continue</nx-button> -->
  <form [formGroup]="tcnForm" (ngSubmit)="onSubmitTnc()">
    <strong>{{ tcnForm.value | json }}</strong>
    {{ tcnForm.status }}

    <nx-input
      formControlName="name"
      placeholder="FirstName"
      label="FirstName"
      autocapitalize="characters"
    >
    </nx-input>

    <nx-input type="text" formControlName="password" label="Password">
    </nx-input>

    <nx-input type="text" formControlName="price" appInrFormat label="Price">
    </nx-input>

    <nx-select
      formControlName="plan"
      label="Plan"
      placeholder="Open this select menu"
      name="plan"
      required
    >
      <nx-select-option value="standard">Standard</nx-select-option>
      <nx-select-option value="premium">Premium</nx-select-option>
      <nx-select-option value="flexible" disabled>Flexible</nx-select-option>
    </nx-select>

    <nx-radio-group value="male" formControlName="gender" name="gender">
      <nx-radio value="male">Male</nx-radio>

      <nx-radio value="female">Female</nx-radio>

      <nx-radio value="other">Other</nx-radio>
    </nx-radio-group>

    <nx-checkbox formControlName="acceptTcn">
      I agree to the Terms,Conditions,and Notices(TCN).
    </nx-checkbox>

    <nx-button class="btn-green" type="submit"> Continue </nx-button>
  </form>
</div>
